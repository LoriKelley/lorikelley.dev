<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presentation Slides</title>
    <style>
        /* Base Reset & Variables */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            width: 100%;
            font-family: Arial, sans-serif;
            overflow: hidden;
            background-color: #111;
            color: #fff;
        }

        /* Full Screen Slide Container */
        .slide-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        .slide {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease-in-out, visibility 0.4s ease-in-out;
        }

        .slide.active {
            opacity: 1;
            visibility: visible;
        }

        .slide-content {
            max-width: 800px;
            width: 100%;
            text-align: center;
        }

        /* Desktop Image Styling */
        .slide-photo {
            max-width: 300px;
            height: auto;
            border-radius: 8px;
            margin-top: 1.5rem;
            display: inline-block;
        }

        /* Navigation Arrow Styling */
        .nav-group-container {
            margin-top: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }

        .next-text {
            font-size: 0.9rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 0.25rem;
            opacity: 0.8;
        }

        .down-arrow {
            font-size: 1.5rem;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-8px); }
            60% { transform: translateY(-4px); }
        }

        /* Mobile Responsive Overrides */
        @media (max-width: 768px) {
            .slide {
                justify-content: flex-start;
                padding: 2rem 8% 3rem 8%;
                overflow-y: auto;
            }

            .slide-content {
                display: flex;
                flex-direction: column;
                align-items: center;
                margin-bottom: 1.5rem;
            }

            /* Forces photo below text centered on Slide 1 */
            .slide:first-child .slide-photo {
                margin: 1.25rem auto 0 auto;
                display: block;
                max-width: 80%;
                height: auto;
            }

            /* Ensures arrow sits completely below content in normal document flow */
            .nav-group-container {
                position: relative !important;
                right: auto !important;
                top: auto !important;
                transform: none !important;
                margin: 0 auto 2rem auto;
                flex-shrink: 0;
            }
        }
    </style>
</head>
<body>

    <div class="slide-container">
        <!-- Slide 1 -->
        <div class="slide active" id="slide1">
            <div class="slide-content">
                <h1>Headline Text</h1>
                <p>Your description text goes here.</p>
                <img src="my-photo.jpg" alt="Profile Picture" class="slide-photo">
            </div>

            <div class="nav-group-container" onclick="nextSlide()">
                <span class="next-text">Next</span>
                <div class="down-arrow">↓</div>
            </div>
        </div>

        <!-- Slide 2 -->
        <div class="slide" id="slide2">
            <div class="slide-content">
                <h1>Slide 2 Title</h1>
                <p>Content for the second slide goes here.</p>
            </div>

            <div class="nav-group-container" onclick="nextSlide()">
                <span class="next-text">Next</span>
                <div class="down-arrow">↓</div>
            </div>
        </div>

        <!-- Slide 3 -->
        <div class="slide" id="slide3">
            <div class="slide-content">
                <h1>Slide 3 Title</h1>
                <p>Content for the third slide goes here.</p>
            </div>

            <div class="nav-group-container" onclick="nextSlide()">
                <span class="next-text">Next</span>
                <div class="down-arrow">↓</div>
            </div>
        </div>
    </div>

    <script>
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide');

        function nextSlide() {
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
        }
    </script>
</body>
</html>
